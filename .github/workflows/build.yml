name: Build GRUB with efidriver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # 1. 取得自己的 GitHub repository
      # ------------------------------------------------------------
      - name: Checkout build repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. 安裝 GRUB 編譯所需工具
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            autopoint \
            gettext \
            pkg-config \
            flex \
            bison \
            gcc \
            make \
            xorriso \
            mtools \
            python3 \
            nasm \
            grub-efi-amd64-bin

      # ------------------------------------------------------------
      # 3. 下載 GRUB
      # ------------------------------------------------------------
      - name: Clone GRUB
        run: |
          git clone https://gitlab.com/gnu_grub/grub.git

          cd grub

          # efidriver v2 patch 的 base commit
          git checkout 9c34d56c2dafcd2737db0e3e49df63bce4d8b504

      # ------------------------------------------------------------
      # 4. 顯示目前 GRUB commit
      # ------------------------------------------------------------
      - name: Show GRUB version
        run: |
          cd grub

          echo "===== GRUB commit ====="
          git log -1 --oneline --decorate

      # ------------------------------------------------------------
      # 5. 修改 chainloader.c
      #
      # 不使用 git apply。
      # 直接按照官方 efidriver v2 patch 的內容修改原始碼。
      # ------------------------------------------------------------
      - name: Apply efidriver changes
        run: |
                cd grub
            
                python3 <<'PY'
                from pathlib import Path
            
                path = Path("grub-core/loader/efi/chainloader.c")
                text = path.read_text()
            
                # 先確認我們實際拿到的原始碼
                start = text.find("static grub_err_t\ngrub_chainloader_boot")
            
                if start == -1:
                    print("ERROR: grub_chainloader_boot not found")
                    print()
                    print("===== source around start =====")
            
                    pos = text.find("grub_chainloader_boot")
            
                    if pos == -1:
                        print("The symbol does not exist in chainloader.c")
                    else:
                        print(text[max(0, pos - 300):pos + 1000])
            
                    raise SystemExit(1)
            
                print("Found grub_chainloader_boot at byte offset:", start)
            
                print()
                print("===== Original grub_chainloader_boot =====")
                print(text[start:start + 1800])
            
                raise SystemExit(0)
                PY
      # ------------------------------------------------------------
      # 6. 確認修改結果
      # ------------------------------------------------------------

      # ------------------------------------------------------------
      # 7. 顯示 Git diff
      # ------------------------------------------------------------
      - name: Show diff
        run: |
          cd grub

          git diff --stat

          echo
          echo "===== git diff ====="

          git diff -- grub-core/loader/efi/chainloader.c
