name: Build GRUB EFI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 1. 取得 repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安裝依賴
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint gettext pkg-config \
            flex bison gcc make xorriso mtools python3 nasm \
            libefivar-dev uuid-dev

      # 3. Clone GRUB 官方 repo
      - name: Clone GRUB
        run: |
          git clone https://git.savannah.gnu.org/git/grub.git
          cd grub
          git checkout 9c34d56c2dafcd2737db0e3e49df63bce4d8b504

      # 4. Apply patch
      - name: Apply efidriver patch
        run: |
          cd grub
          git am ../patches/efidriver-v2.patch || \
          git apply --ignore-space-change --ignore-whitespace ../patches/efidriver-v2.patch

      # 5. Configure & build
      - name: Build GRUB
        run: |
          cd grub
          ./bootstrap
          ./configure --with-platform=efi --target=x86_64 --prefix=/usr --disable-werror
          make -j$(nproc)

      # 6. 安裝到暫存目錄
      - name: Install GRUB locally
        run: |
          cd grub
          make install DESTDIR=$PWD/grub-install
          find grub-install -type f -name '*.mod' | head -n 20

      # 7. mkimage，指定模組來源
      - name: Build GRUB EFI
        run: |
          cd grub
          MODULE_DIR="$PWD/grub-install/usr/lib/grub/x86_64-efi"
          if [ ! -d "$MODULE_DIR" ]; then
            MODULE_DIR="$PWD/grub-install/lib/grub/x86_64-efi"
          fi
          grub-mkimage -O x86_64-efi -o grubx64.efi -p /boot/grub \
            -d "$MODULE_DIR" \
            chainloader part_gpt part_msdos fat ext2 normal linux \
            efi_gop efi_uga

      # 8. 上傳成果
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grubx64-efi
          path: grub/grubx64.efi
