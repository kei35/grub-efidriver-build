name: Build GRUB with efidriver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 1. 取得 repository
      - name: Checkout build repository
        uses: actions/checkout@v4

      # 2. 安裝 GRUB 編譯所需工具
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint gettext pkg-config \
            flex bison gcc make xorriso mtools python3 nasm \
            grub-efi-amd64-bin

      # 3. 下載 GRUB
      - name: Clone GRUB
        run: |
          git clone https://gitlab.com/gnu_grub/grub.git
          cd grub
          git checkout 9c34d56c2dafcd2737db0e3e49df63bce4d8b504

      # 4. 顯示目前 GRUB commit
      - name: Show GRUB version
        run: |
          cd grub
          git log -1 --oneline --decorate

      # 5. 套用你 repo 裡的 efidriver patch
      - name: Apply efidriver patch
        run: |
          cd grub
          git apply ../patches/efidriver-v2.patch

      # 6. 編譯 GRUB
      - name: Build GRUB
        run: |
          cd grub
          ./bootstrap
          ./configure --with-platform=efi --target=x86_64
          make

      # 7. 產生 EFI binary
      - name: Build GRUB EFI
        run: |
          cd grub
          grub-mkimage -O x86_64-efi -o grubx64.efi efidriver chainloader

      # 8. 上傳成果
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grubx64-efi
          path: grub/grubx64.efi
