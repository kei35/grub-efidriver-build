name: Build GRUB EFI with efidriver

on:
  push:
    branches: [ master, dev ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. 取得自己的 GitHub repository
      # ============================================================
      - name: Checkout build repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. 安裝 GRUB 編譯環境
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            autopoint \
            bison \
            flex \
            gcc \
            gettext \
            git \
            make \
            mtools \
            nasm \
            pkg-config \
            python3 \
            xorriso \
            libfreetype6-dev \
            libfontconfig1-dev \
            libdevmapper-dev \
            liblzma-dev


      # ============================================================
      # 3. 下載 GRUB (自動防呆防重複)
      # ============================================================
      - name: Clone GRUB
        run: |
          if [ -d "grub" ]; then
              rm -rf grub
          fi

          git clone https://gitlab.com/gnu_grub/grub.git
          cd grub
          git checkout 9c34d56c2dafcd2737db0e3e49df63bce4d8b504


      # ============================================================
      # 4. 顯示 GRUB 版本
      # ============================================================
      - name: Show GRUB version
        run: |
          cd grub
          echo "========================================"
          echo "GRUB commit"
          echo "========================================"
          git log -1 --oneline --decorate
          echo
          echo "========================================"
          echo "GRUB status"
          echo "========================================"
          git status


      # ============================================================
      # 5. 修改 chainloader.c (透過 Python 自動化 Patch)
      # ============================================================
      - name: Apply efidriver changes
        shell: bash
        run: |
          cd grub

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("grub-core/loader/efi/chainloader.c")
          text = path.read_text()

          print("Original source size:", len(text), "bytes")

          def find_function(text, name):
              pattern = re.compile(r"static\s+grub_err_t\s+" + re.escape(name) + r"\s*\(")
              match = pattern.search(text)
              if not match:
                  return None
              brace_start = text.find("{", match.end())
              if brace_start == -1:
                  raise RuntimeError(f"Cannot find opening '{{' for {name}")
              depth = 0
              for i in range(brace_start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return match.start(), i + 1
              raise RuntimeError(f"Cannot find end of {name}")

          # A. 加入 stdbool.h
          if "#include <stdbool.h>" not in text:
              marker = "#include <grub/loader.h>"
              if marker not in text:
                  raise RuntimeError("Cannot find #include <grub/loader.h>")
              text = text.replace(marker, "#include <stdbool.h>\n" + marker, 1)
              print("Added <stdbool.h>")
          else:
              print("<stdbool.h> already exists")

          # B. 修改 grub_chainloader_boot()
          result = find_function(text, "grub_chainloader_boot")
          if result is None:
              raise RuntimeError("Cannot find grub_chainloader_boot")
          start, end = result

          new_functions = r'''static grub_err_t
          start_efi_image (grub_efi_handle_t image_handle, bool driver)
          {
            grub_efi_boot_services_t *b;
            grub_efi_status_t status;
            grub_efi_uintn_t exit_data_size;
            grub_efi_char16_t *exit_data = NULL;

            b = grub_efi_system_table->boot_services;

            status = b->start_image (
              image_handle,
              &exit_data_size,
              &exit_data
            );

            if (status != GRUB_EFI_SUCCESS
                && !(driver && status == GRUB_EFI_ABORTED))
              {
                if (exit_data)
                  {
                    char *buf;
                    buf = grub_malloc (exit_data_size * 4 + 1);
                    if (buf)
                      {
                        *grub_utf16_to_utf8 ((grub_uint8_t *) buf, exit_data, exit_data_size) = 0;
                        grub_error (GRUB_ERR_BAD_OS, "%s", buf);
                        grub_free (buf);
                      }
                  }
                else
                  grub_error (GRUB_ERR_BAD_OS, "unknown error");
              }

            if (exit_data)
              b->free_pool (exit_data);

            return grub_errno;
          }

          static grub_err_t
          grub_chainloader_boot (void *context)
          {
            grub_efi_handle_t image_handle = (grub_efi_handle_t) context;
            grub_err_t ret;
            ret = start_efi_image (image_handle, false);
            grub_loader_unset ();
            return ret;
          }'''

          text = text[:start] + new_functions + text[end:]
          print("Replaced grub_chainloader_boot")

          # C. 改名 grub_cmd_chainloader -> load_efi_image
          pattern = re.compile(
              r"static\s+grub_err_t\s+"
              r"grub_cmd_chainloader\s*"
              r"\(\s*"
              r"grub_command_t\s+cmd\s+"
              r"__attribute__\s*\(\(\s*unused\s*\)\)"
              r"\s*,\s*"
              r"int\s+argc\s*,\s*"
              r"char\s*\*argv\[\]\s*"
              r"\)"
          )
          match = pattern.search(text)
          if not match:
              raise RuntimeError("Cannot find original grub_cmd_chainloader declaration")
          replacement = "static grub_err_t\nload_efi_image (int argc, char *argv[], grub_efi_handle_t *image_ret)"
          text = text[:match.start()] + replacement + text[match.end():]

          # D. 修改 load_efi_image 返回
          pattern = re.compile(
              r"\s*grub_loader_set_ex\s*\("
              r"\s*grub_chainloader_boot\s*,"
              r"\s*grub_chainloader_unload\s*,"
              r"\s*image_handle\s*,\s*0\s*\)\s*;"
              r"\s*return\s+0\s*;"
          )
          match = pattern.search(text)
          if not match:
              raise RuntimeError("Cannot find grub_loader_set_ex()")
          replacement = "\n    *image_ret = image_handle;\n    return GRUB_ERR_NONE;\n  "
          text = text[:match.start()] + replacement + text[match.end():]

          # E. 註冊新指令
          registration_start = text.find("static grub_command_t cmd;")
          init_start = text.find("GRUB_MOD_INIT(chainloader)", registration_start)
          fini_start = text.find("GRUB_MOD_FINI(chainloader)", init_start)
          fini_brace = text.find("{", fini_start)
          
          depth = 0
          fini_end = None
          for i in range(fini_brace, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      fini_end = i + 1
                      break

          new_registration = r'''static grub_err_t
          grub_cmd_chainloader (grub_command_t cmd __attribute__ ((unused)), int argc, char *argv[])
          {
            grub_efi_handle_t image_handle = NULL;
            grub_err_t ret;
            ret = load_efi_image (argc, argv, &image_handle);
            if (ret != GRUB_ERR_NONE)
              return ret;
            grub_loader_set_ex (grub_chainloader_boot, grub_chainloader_unload, image_handle, 0);
            return GRUB_ERR_NONE;
          }

          static grub_err_t
          grub_cmd_efidriver (grub_command_t cmd __attribute__ ((unused)), int argc, char *argv[])
          {
            grub_efi_handle_t image_handle = NULL;
            grub_err_t ret;
            ret = load_efi_image (argc, argv, &image_handle);
            if (ret != GRUB_ERR_NONE)
              return ret;
            ret = start_efi_image (image_handle, true);
            grub_dl_unref (my_mod);
            return ret;
          }

          static grub_command_t cmd_chainloader;
          static grub_command_t cmd_efidriver;

          GRUB_MOD_INIT(chainloader)
          {
            cmd_chainloader = grub_register_command ("chainloader", grub_cmd_chainloader, 0, N_("Load another boot loader."));
            cmd_efidriver = grub_register_command ("efidriver", grub_cmd_efidriver, 0, N_("Load a efi driver."));
            my_mod = mod;
          }

          GRUB_MOD_FINI(chainloader)
          {
            grub_unregister_command (cmd_chainloader);
            grub_unregister_command (cmd_efidriver);
          }'''

          text = text[:registration_start] + new_registration + text[fini_end:]
          path.write_text(text)
          print("efidriver source modification completed")
          PY


      # ============================================================
      # 6. Bootstrap GRUB
      # ============================================================
      - name: Bootstrap GRUB
        run: |
          cd grub
          ./bootstrap --no-git --gnulib-srcdir=gnulib || {
              git clone https://github.com/coreutils/gnulib.git gnulib
              ./bootstrap --gnulib-srcdir=gnulib
          }


      # ============================================================
      # 7. Configure GRUB
      # ============================================================
      - name: Configure GRUB
        run: |
          cd grub
          mkdir -p build
          cd build
          ../configure --target=x86_64 --with-platform=efi --disable-werror --prefix="$GITHUB_WORKSPACE/grub-install"


      # ============================================================
      # 8. 編譯 GRUB
      # ============================================================
      - name: Build GRUB
        run: |
          cd grub/build
          make -j"$(nproc)"


      # ============================================================
      # 9. 安裝 GRUB
      # ============================================================
      - name: Install GRUB to temporary prefix
        run: |
          cd grub/build
          make install


      # ============================================================
      # 10. 建立 Embedded Early GRUB Config (使用 sed 注入版本號)
      # ============================================================
      - name: Create Embedded Early GRUB Config
        run: |
          # 1. 取得台北時間作為版本號
          BUILD_VER=$(TZ='Asia/Taipei' date +"ver.%Y.%m%d.%H%M")
          echo "BUILD_VER=$BUILD_VER" >> $GITHUB_ENV

          # 2. 建立 early.cfg (使用 'EOF' 避免 Bash 解析 $ 符號)
          cat << 'EOF' > early.cfg
          set prefix=(memdisk)/boot/grub
          set build_version="__BUILD_VER__"

          echo "=================================================="
          echo " Custom GRUB EFI (__BUILD_VER__)"
          echo "=================================================="

          # ============================================================
          # 1. 載入 Xbox 控制器 EFI 驅動程式 (常駐記憶體)
          # ============================================================
          if search --no-floppy --file --set=root /EFI/BOOT/BOOTX64.EFI ; then
              
              if [ -f ($root)/EFI/rEFInd/drivers_x64/UsbXbox360Dxe_.efi ]; then
                  echo "[__BUILD_VER__] Loading Xbox Driver from rEFInd folder..."
                  efidriver ($root)/EFI/rEFInd/drivers_x64/UsbXbox360Dxe_.efi

              elif [ -f ($root)/EFI/rEFInd/drivers_x64/UsbXbox360Dxe.efi ]; then
                  echo "[__BUILD_VER__] Loading Xbox Driver (without underscore)..."
                  efidriver ($root)/EFI/rEFInd/drivers_x64/UsbXbox360Dxe.efi

              elif [ -f ($root)/EFI/BOOT/drivers/UsbXbox360Dxe.efi ]; then
                  echo "[__BUILD_VER__] Loading Xbox Driver from /EFI/BOOT/drivers/..."
                  efidriver ($root)/EFI/BOOT/drivers/UsbXbox360Dxe.efi

              else
                  echo "Warning: UsbXbox360Dxe.efi not found in primary paths!"
                  echo "Attempting to continue without driver in 5 seconds..."
                  sleep 5
              fi
          fi

          # ============================================================
          # 2. 搜尋 CachyOS / Linux 設定檔並載入
          # ============================================================
          if search --no-floppy --file --set=root /boot/grub/grub.cfg ; then
              echo "[__BUILD_VER__] Found /boot/grub/grub.cfg, loading..."
              clear
              configfile ($root)/boot/grub/grub.cfg
          elif search --no-floppy --file --set=root /EFI/cachyos/grub.cfg ; then
              echo "[__BUILD_VER__] Found /EFI/cachyos/grub.cfg, loading..."
              clear
              configfile ($root)/EFI/cachyos/grub.cfg
          elif search --no-floppy --file --set=root /EFI/BOOT/grub.cfg ; then
              echo "[__BUILD_VER__] Found /EFI/BOOT/grub.cfg, loading..."
              clear
              configfile ($root)/EFI/BOOT/grub.cfg
          else
              echo "No .cfg file found on ext4 or FAT partitions!"
              echo "Displaying fallback menu..."
              set default=0
              set timeout=10
              menuentry "Reboot System (__BUILD_VER__)" { reboot }
              menuentry "Power Off" { halt }
          fi
          EOF

          # 3. 將預留位置 __BUILD_VER__ 替換為實際的時間版本號
          sed -i "s/__BUILD_VER__/$BUILD_VER/g" early.cfg


      # ============================================================
      # 11. 建立 BOOTX64.EFI (包含 ext2/btrfs/xfs 檔案系統支援)
      # ============================================================
      - name: Build GRUB EFI
        run: |
          PREFIX="$GITHUB_WORKSPACE/grub-install"
          MODULE_DIR="$PREFIX/lib/grub/x86_64-efi"
          MKSTANDALONE="$PREFIX/bin/grub-mkstandalone"
          OUTPUT_DIR="$GITHUB_WORKSPACE/output"
          OUTPUT="$OUTPUT_DIR/BOOTX64.EFI"

          mkdir -p "$OUTPUT_DIR"

          "$MKSTANDALONE" \
            -d "$MODULE_DIR" \
            -O x86_64-efi \
            -o "$OUTPUT" \
            --modules="part_gpt part_msdos fat ext2 btrfs xfs normal configfile echo search search_fs_uuid search_fs_file sleep" \
            "boot/grub/grub.cfg=$GITHUB_WORKSPACE/early.cfg"


      # ============================================================
      # 12. 上傳 Artifact
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GRUB-efidriver-${{ github.sha }}
          path: output/*


      # ============================================================
      # 13. 打包 7z
      # ============================================================
      - name: Package output into 7z
        run: |
          sudo apt-get install -y p7zip-full
          7z a output/GRUB-efidriver-${{ github.ref_name }}.7z output/*


      # ============================================================
      # 14. 建立 GitHub Release
      # ============================================================
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: output/GRUB-efidriver-${{ github.ref_name }}.7z
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
