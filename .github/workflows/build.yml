name: Test GRUB Patch

on:
  workflow_dispatch:

jobs:
  patch-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Clone GRUB
        run: |
          git clone https://gitlab.com/gnu_grub/grub.git
          cd grub
          git checkout 9c34d56c2dafcd2737db0e3e49df63bce4d8b504

      - name: Check patch
        run: |
          cd grub
          git apply --check ../patches/efidriver-v2.patch
