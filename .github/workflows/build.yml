name: GRUB Patch Debug

on:
  workflow_dispatch:

jobs:
  build-original:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint gettext pkg-config \
            flex bison gcc make xorriso mtools python3 nasm \
            libefivar-dev uuid-dev

      - name: Clone GRUB
        run: |
          git clone https://git.savannah.gnu.org/git/grub.git
          cd grub
          git checkout 9c34d56c2dafcd2737db0e3e49df63bce4d8b504

      - name: Build GRUB (no patch)
        run: |
          cd grub
          ./bootstrap
          ./configure --with-platform=efi --target=x86_64 --prefix=/usr --disable-werror
          make -j$(nproc)
          make install DESTDIR=$PWD/grub-install
          find grub-install -name 'chainloader.mod' || echo "chainloader.mod not found"
          find grub-install -name 'moddep.lst' || echo "moddep.lst not found"

  build-patched:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint gettext pkg-config \
            flex bison gcc make xorriso mtools python3 nasm \
            libefivar-dev uuid-dev

      - name: Clone GRUB
        run: |
          git clone https://git.savannah.gnu.org/git/grub.git
          cd grub
          git checkout 9c34d56c2dafcd2737db0e3e49df63bce4d8b504

      - name: Apply patch
        run: |
          cd grub
          git am ../patches/efidriver-v2.patch || \
          git apply --ignore-space-change --ignore-whitespace ../patches/efidriver-v2.patch

      - name: Build GRUB (with patch)
        run: |
          cd grub
          ./bootstrap
          ./configure --with-platform=efi --target=x86_64 --prefix=/usr --disable-werror
          make -j$(nproc)
          make install DESTDIR=$PWD/grub-install
          find grub-install -name 'chainloader.mod' || echo "chainloader.mod not found"
          find grub-install -name 'moddep.lst' || echo "moddep.lst not found"
