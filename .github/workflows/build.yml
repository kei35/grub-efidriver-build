name: Test GRUB Patch

on:
  workflow_dispatch:

jobs:
  patch-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Clone GRUB
        run: |
          git clone https://gitlab.com/gnu_grub/grub.git
          cd grub
          git checkout 9c34d56c2dafcd2737db0e3e49df63bce4d8b504

      - name: Check patch file
        run: |
          echo "=== Patch file ==="
          wc -l patches/efidriver-v2.patch
          echo "=== Patch header ==="
          head -20 patches/efidriver-v2.patch

            - name: Repair patch line wrapping
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("patches/efidriver-v2.patch")
          s = p.read_text()

          replacements = {
              "@@ -209,8 +222,7 @@ make_file_path (grub_efi_device_path_t *dp, const char \n *filename)":
              "@@ -209,8 +222,7 @@ make_file_path (grub_efi_device_path_t *dp, const char *filename)",

              "@@ -400,8 +412,8 @@ grub_cmd_chainloader (grub_command_t cmd __attribute__ \n ((unused)),":
              "@@ -400,8 +412,8 @@ grub_cmd_chainloader (grub_command_t cmd __attribute__ ((unused)),",

              "-  grub_loader_set_ex (grub_chainloader_boot, grub_chainloader_unload, \n-image_handle, 0);":
              "-  grub_loader_set_ex (grub_chainloader_boot, grub_chainloader_unload, image_handle, 0);",

              "+  grub_loader_set_ex (grub_chainloader_boot, grub_chainloader_unload, \n+image_handle, 0);":
              "+  grub_loader_set_ex (grub_chainloader_boot, grub_chainloader_unload, image_handle, 0);",

              "+  cmd_chainloader = grub_register_command (\"chainloader\", \n+ grub_cmd_chainloader,":
              "+  cmd_chainloader = grub_register_command (\"chainloader\", grub_cmd_chainloader,",

          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)
          PY

      - name: Check patch
        run: |
          cd grub
          git apply --check ../patches/efidriver-v2.patch
