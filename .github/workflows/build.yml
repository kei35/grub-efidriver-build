name: Test GRUB Source

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download GRUB source
        run: |
          git clone https://gitlab.com/gnu_grub/grub.git
          cd grub
          git checkout 9c34d56c2dafcd2737db0e3e49df63bce4d8b504

      - name: Show GRUB version
        run: |
          cd grub
          git log -1 --oneline
          git status
